[build]
  command = "npm run build"
  publish = "dist"

# Empty base URL: the browser calls /api/... on the Netlify origin (trucks.rollingradius.com), and
# the redirect below forwards it to the API over HTTPS. Same-origin, so no CORS and no API host
# in the bundle. Vite bakes this in at build time.
[build.environment]
  VITE_API_BASE_URL = ""

# Must come before the SPA fallback. Netlify uses the first matching rule.
[[redirects]]
  from = "/api/*"
  to = "https://api.trucks.rollingradius.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

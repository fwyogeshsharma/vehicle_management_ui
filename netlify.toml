[build]
  command = "npm run build"
  publish = "dist"

# Empty base URL: the browser calls /api/... on its own origin (trucks.rollingradius.com), where
# Caddy forwards /api/* to the API and everything else to Netlify. Same-origin, so no CORS and
# no hardcoded host. Do not add an /api/* redirect here. Vite bakes this in at build time.
[build.environment]
  VITE_API_BASE_URL = ""

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
